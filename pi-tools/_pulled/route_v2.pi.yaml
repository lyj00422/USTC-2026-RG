route_v2:
  vision:
    # Field-dependent travel bounds and pixel gates below are placeholders until
    # the Raspberry Pi calibration runbook has been completed.  --full refuses
    # this file while calibrated is false.
    calibrated: true
    frame_timeout_s: 0.5
    task_startup_timeout_s: 2.0
    # 最慢实测检测约 0.29 s，latest-only 结果年龄锯齿上界约 0.58 s。
    # 暂时陈旧先停车，持续到 1.0 s 才锁存故障。
    result_stall_timeout_s: 1.0
    prescan_frames: 10
    prescan_confirm_frames: 3
    tag_takeover_max_cm: 30.0
    tag_takeover_timeout_s: 6.0
    action_wait_s: 3.0
    # 0004 动作包是紫色抓取的唯一执行真源。正向速度 20 是已实机执行的最低可信值；
    # 现场可继续向下试，但配置校验禁止高于动作包值，程序不会因静摩擦自动加速。
    purple_action_package: data/route_v2_actions/purple_pickup_v1
    purple_action_forward_speed: 20
    purple_action_ack_timeout_s: 1.0
    tag_gates:
      pickup_seek_line:
        target_id: 3
        center_window: [0.30, 0.20, 0.70, 0.80]
        edge_px: [18, 220]
        confirm_frames: 3
      pickup_2_seek_line:
        target_id: 4
        # 2026-09-17 现场实测（`data/route_vision_calibration/tag4-reached/`）：
        # 让车**自己走到** PICKUP_2_SEEK_LINE 的真实位姿上采 60 帧，Tag4 中心
        # x = 0.28 —— 占位左界 0.30 把**整段采样全拒了**（0/60 帧通过）。
        #
        # 同一天手工摆位实测是 x = 0.48。两者差 0.20，并不是谁摆错了，而是
        # **同一次左移横移上的两个点**：车向左移 ⇒ 静止的 Tag4 在画面里向右移。
        # 所以窗口必须同时覆盖起点和横移途中。左界放到 0.20，给 0.28 留 0.08 余量。
        #
        # ⚠️ 右界 0.70 仍是占位值，**只有实测证据的一侧被改**。横移中 Tag4 中心
        # 最终能漂到哪，当前遥测量不到（不记 center_px，见 §13.4），所以不猜。
        center_window: [0.20, 0.20, 0.70, 0.80]
        edge_px: [18, 220]
        confirm_frames: 3
    block_profiles:
      purple_j3_prescan:
        roi: [0.05, 0.20, 0.95, 0.90]
        capture_window: [0.35, 0.35, 0.65, 0.85]
        hsv_bands: [{lower: [110, 20, 70], upper: [150, 180, 220]}]
        lab_bands: [{lower: [70, 131, 100], upper: [190, 155, 125]}]
        # 2026-09-18 现场空场最大噪声 2955 px2；3000 只留下 45 px2
        # 余量，光照或地面杂物变化时会重新误触发。6000 仍低于台架真块
        # 最小 13095 px2，并保留超过 2 倍的真实目标余量。
        area_px: [6000, 150000]
        aspect_ratio: [0.35, 2.8]
        height_px: [12, 450]
        # 实车误检集中在画面上方（例如 y≈235），而台架真块最低也在
        # y≈354/720。抬高下界避免固定背景紫斑把 center 区投票锁死。
        center_y: [0.45, 0.95]
        min_rectangularity: 0.45
        morphology_kernel: 3
      purple_pickup_close:
        roi: [0.08, 0.28, 0.92, 0.98]
        # 0004 zones.json 的 1280x720 像素窗口归一化值；仍需现场左右微调。
        capture_window: [0.4739738806, 0.4731343284, 0.5369402985, 0.5805970149]
        hsv_bands: [{lower: [110, 20, 70], upper: [150, 180, 220]}]
        lab_bands: [{lower: [70, 131, 100], upper: [190, 155, 125]}]
        # 完整色带负责确认近距目标存在；亮色核心只负责算质心。2026-09-17
        # 现场照片中方块本体 HSV V=169~184，而连到桌面的反光 V=73~94，
        # 原完整轮廓把质心从约 y=391 拉到 y=455。亮色核心切断反光，候选的
        # 面积、底边和近场填充仍用完整轮廓，避免改变“是否存在目标”的语义。
        centroid_hsv_bands: [{lower: [110, 20, 110], upper: [150, 180, 220]}]
        centroid_lab_bands: [{lower: [110, 131, 100], upper: [190, 155, 125]}]
        centroid_min_area_px: 100000
        # `local-materials/vision-captures/photo/kuai/zise` 的 JPG/录像抽帧：真近距目标面积 212k~323k、
        # bbox 高 398~504 px、质心 y 0.555~0.659、底边 y 0.833~0.981。
        # `local-materials/vision-captures/photo/tag` 远处方块/环境候选最大面积约 76k；150k 留足真目标余量，
        # 同时不再让几百像素的色斑触发停车和对中。
        area_px: [150000, 600000]
        aspect_ratio: [0.45, 2.2]
        height_px: [350, 520]
        center_y: [0.52, 0.72]
        bottom_y: [0.80, 1.00]
        # 外接框可能被零散杂色拉到 ROI 底部；再要求轮廓本身实际填充画面下部。
        # 现有正样本为 0.253~0.630，local-materials/vision-captures/photo/tag 负例最高约 0.248 且面积仅 76k；
        # 0.20 与 150k 面积门槛联合使用，不单独依赖某一个特征。
        near_field: [0.08, 0.70, 0.92, 0.98]
        min_near_field_fill: 0.20
        min_rectangularity: 0.52
        morphology_kernel: 3
      orange_pickup_close:
        roi: [0.08, 0.28, 0.92, 0.98]
        capture_window: [0.42, 0.42, 0.58, 0.88]
        hsv_bands: [{lower: [2, 8, 150], upper: [25, 80, 245]}]
        # 现场 close 真目标 60 帧中 Lab 命中 0 次，却命中环境杂物 15/18；
        # 该通道只有误检贡献，近场橙色保留已覆盖真目标的 HSV。
        lab_bands: []
        # `local-materials/vision-captures/photo/kuai/orange` 的 JPG/录像抽帧：真近距目标面积 212k~345k、
        # bbox 高 436~504 px、质心 y 0.598~0.689、底边 y 0.897~0.981。
        # 阈值与紫色统一取更宽的正样本包络，避免按单张照片过拟合。
        area_px: [150000, 600000]
        aspect_ratio: [0.45, 2.2]
        height_px: [350, 520]
        center_y: [0.52, 0.72]
        bottom_y: [0.80, 1.00]
        near_field: [0.08, 0.70, 0.92, 0.98]
        min_near_field_fill: 0.20
        min_rectangularity: 0.52
        morphology_kernel: 3
    pickup_areas:
      purple:
        profile: purple_pickup_close
        # J3 预扫描只给粗方向。碰撞后用路线已实测过的 40 档快速横移；
        # 一旦近距 profile 出现候选立即停车，28/12 仍只用于后续精对准。
        search_speed: 40
        coarse_speed: 28
        fine_speed: 12
        confirm_frames: 3
        settle_s: 0.25
        return_tolerance_cm: 2.0
        alignment_max_distance_cm: 25.0
        alignment_timeout_s: 12.0
        locked_reacquire_timeout_s: 2.0
        max_alignment_reversals: 6
        # 2026-09-17 现场：**这是操作员定义的安全里程，不是实测碰撞点。**
        #
        # 实测（`logs/calibration/purple-right2.samples.jsonl`）：以 `--speed 10`
        # 从取物区2 撞墙停姿向右连续横移，**110.18 cm 全程横向速度恒定
        # ≈4.1 cm/s，四轮编码器平滑单调，没有任何堵转或打滑** —— 即右侧 110 cm
        # 之内**没有障碍物**。"1 米处有墙"这个前提与实测不符（墙更远，或取物区2
        # 的朝向与设想不同）。
        #
        # 所以这一条按执行单「若持续打滑，接触不能作主判据，必须用人工确认的
        # 安全里程」处理：操作员裁定 **1 米即为边界**。
        #
        # ⚠️ `timeout_s` 是从实测速度 4.1 cm/s 推的：100 cm ≈ 24.4 s，加起步斜坡
        # 取 30 s。**它必须大于 `max_distance_cm` 走完所需的时间**，否则先被时间
        # 掐掉、距离界形同虚设（前一跑就是这么白跑的：8 s 超时只走了 27.8 cm）。
        search_right: {max_distance_cm: 100.0, timeout_s: 30.0}
        # 2026-09-17 现场：**左侧有坡边，这是唯一的安全边界**（没有可靠的碰撞边界）。
        #
        # 实测（`logs/calibration/purple-left.samples.jsonl`）：`--speed 10` 向左
        # 连续横移 **40.04 cm**，逐拍速度均值 **4.00 cm/s**、无坡道引起的加减速，
        # 制动滑移 **0.30 cm**；**发 STOP 后编码器 14 个样本完全不动 —— 没有回滑**。
        #
        # 操作员当场判定：**40 cm 没下坡，但已经很极限**，故 **收 5 cm 到 35**。
        #
        # ⚠️ `timeout_s` 必须大于走完 `max_distance_cm` 所需时间（35 cm ÷ 4.0 cm/s
        # ≈ 8.8 s），否则先被时间掐掉、距离界形同虚设 —— 右侧就是这么白跑过一次
        # （8 s 超时只走了 27.8 cm）。取 12 s。
        search_left: {max_distance_cm: 35.0, timeout_s: 12.0}
      orange:
        profile: orange_pickup_close
        # 橙色流程未改策略，搜索速度保持原 28 档。
        search_speed: 28
        coarse_speed: 28
        fine_speed: 12
        confirm_frames: 3
        settle_s: 0.25
        return_tolerance_cm: 2.0
        alignment_max_distance_cm: 25.0
        alignment_timeout_s: 12.0
        locked_reacquire_timeout_s: 2.0
        max_alignment_reversals: 6
        # 2026-09-17 现场实测（`logs/calibration/orange-right.samples.jsonl`，209 拍）：
        # 从取物区1 橙色停姿 `--speed 10` 向右横移 **80.14 cm** 到硬上限，
        # `reason: hard_distance_limit`（**不是** `hard_timeout` ⇒ 全程没失速），
        # 逐拍速度均值 **4.03 cm/s**、无坡道加减速，制动滑移 **0.30 cm**。
        # 掩码：起姿线在探头排右半（`0xC0`），右移 0.85 cm 处 `0x81` 居中，
        # 至 **6.29 cm** 线从左端 `x1` 扫出探头排，之后 **74 cm 全 `0xFF`**。
        #
        # ⚠️ 这一跑**没有真正触到墙** —— 它是走到 80 硬上限停的，所以证明的是
        # 「右侧 80 cm 内无遮挡」，**不是**「墙在 80」。真接触边界由操作员人工试得
        # **左右各 80 cm**。执行单第 6 步要求的「两侧核实真接触与打滑」，**探头给不了**：
        # `probe-strafe` 根本没有接触检测（`route_v2.md` §15.13，含 `contact_detected`
        # 恒为 false 的读码证据）。故按 §15.6 紫区先例**收 5 cm 留余量：80 → 75**。
        #
        # ⚠️ `timeout_s` 必须大于走完 `max_distance_cm` 所需时间，否则先被时间掐掉、
        # 距离界形同虚设（紫区右侧就这么白跑过一次：8 s 超时只走了 27.8 cm）。
        # 75 cm ÷ 3.74 cm/s（两侧实测的较慢值）≈ 20.1 s，取 28 s。
        search_right: {max_distance_cm: 75.0, timeout_s: 28.0}
        # 2026-09-17 现场实测（`logs/calibration/orange-left.samples.jsonl`，209 拍）：
        # 同一橙色停姿 `--speed 10` 向左横移 **80.37 cm** 到硬上限，
        # `hard_distance_limit`，逐拍速度均值 **3.74 cm/s**，制动滑移 **0.21 cm**。
        # 掩码走向与右移**相反**（方向确认无误）：起姿 `0x01`，0.22 cm 处 `0x81` 居中，
        # 至 **5.81 cm** 线从右端 `x8` 扫出探头排，之后 **74 cm 全 `0xFF`**。
        # 同样**没有触到墙**；人工测得左边界同为 80，同样收 5 cm → **75**。
        #
        # 两侧**分别实测、各自填写**，未镜像复制（执行单第 6 步的硬要求）——
        # 左 80.37 / 右 80.14 cm、4.03 / 3.74 cm/s 都是独立读数。
        search_left: {max_distance_cm: 75.0, timeout_s: 28.0}
  # 岔路口判据 —— 是"分支"，不是"全黑"。
  #
  # 探头顺序 x1..x8 从车尾看是「左→右」（2026-09-14 用把黑线分别摆到车体
  # 左端和右端实测确认）。0 = 该路探头压黑线。
  #
  #     正常居中巡线        10000001  (0x81)  — 最右 x8 是白
  #     分支在右侧          10000000  (0x80)  — 最右 x8 变黑
  #
  # ⚠ 路线上**已经没有任何一个路口**用它做到达判据了。三个都被实测赶走了：
  #     J1 → 「持续丢线 + 里程闸门」（见下面的 start_to_junction_1_cm）
  #     J2 → 持续丢线（东段是 L 角，线拐弯断开）
  #     J3 → 里程计（J3 是 T 口，线根本不断）
  # `_JUNCTION_WATCH_STATES` 因此是空的 —— 这是终点，不是遗漏。
  #
  # 赶走它的原因都是同一个：`10000000` 由两种情况产生 —— 真的右侧分支，以及
  # **车歪了一点、探头排不垂直于黑线**。两者在传感器上完全一样，无法区分。
  # 于是它在直道上被巡线自身的抖动连出 3 帧、把车停在直道正中（2026-09-15
  # 实测，124.9 cm 处，line_error 只有 0.14）；更早一次是 2026-09-14，车刚从
  # 起点出来 5cm 就被判成 J1 停住（用户原话："从出发点出来一点点，因为没有走
  # 直线歪了一点，成了 10000000 就停止了"）。
  #
  # 它现在只作为 **J1 倒车对齐的目标读数**活着（与 align_alt_mask 一起，见文件末尾）。
  junction_mask: 128
  junction_debounce_frames: 3
  leave_debounce_frames: 3
  # J1 = **线走到尽头**。判据是「持续丢线」，不是固定距离。
  # 下面两个键是它的闸门和兜底，**不是"起点到 J1 的距离"**。
  #
  # 2026-09-15 三次实测（同一指令，同一段路）：
  #     56.6 cm  （车歪出去了）
  #     62.9 cm  （走得很稳，掩码 ±1 路）
  #     68.2 cm  （操作员确认"超过了 J1"）
  # 固定距离在这个区间里晃 11 厘米，而且有一跑把触发点设在 75 时，车只走到
  # 71.5 就停了 —— **触发点设在车到不了的地方，状态机从头到尾没离开过起点，
  # 倒车对齐一次都没执行**（操作员原话："超过J1 没往回倒"）。
  #
  # 而"线没了"（11111111）是传感器直接报出来的物理事实，线就是在 J1 断的。
  # 它唯一的歧义是"车歪出去也会丢线"，所以用里程做闸门把两者分开：
  #
  #   start_to_junction_1_cm     = 里程闸门（下限）。在此之前丢线算"歪出去了"
  #   junction_1_max_travel_cm   = 兜底（上限）。用于线永不到头的场地，
  #                                否则状态机会永远停在起点
  start_to_junction_1_cm: 50
  junction_1_max_travel_cm: 130
  poll_period_s: 0.05
  # 2026-09-16 从 35 提到 45（操作员：「前进速度在pid的范围内安全提高点」）。
  #
  # "在 PID 的范围内"这条约束是**量出来的，不是猜的**。min250e 全跑 626 个
  # PID 采样：correction 撞到 lateral_limit 只有 2 次、撞到 yaw_limit 只有
  # 1 次 —— 罕见；但 line_error 的 p95 是 0.54，`kp × 0.54 = 18.9`，而
  # lateral_limit 是 20。**95 分位的纠正量已经贴着钳位了**，再乘 1.29 的
  # 前进速度就是 ~24，直接穿过去。
  # 所以是**钳位跟着速度一起抬**（见下面 lateral_limit / yaw_limit），
  # 而不是让速度撞进一个答不上来的钳位里。
  #
  # 2026-09-16 再 45 → 55（操作员：「提高一下直行速度 在pid的控制范围内 提高到最高」）。
  #
  # 幅度沿用上面那条约束本身来定，而不是拍一个数：min250e 的 626 个采样给出
  # line_error p95 = 0.54，`kp × p95 = 35 × 0.54 = 18.9`，而 lateral_limit
  # 现在是 26 —— **p95 只占掉钳位的 73%**。把它推到 100% 就是 ×1.37，即
  # forward_speed ≈ 60。**55 是从 45 迈出的第一步，没直接跳到 60**，理由和
  # 35→45 那次一样：45 以上**一个实测点都没有**（§9 的 `speed45` 是 45 的
  # 唯一验证），一次跳太多，出事时分不清是速度还是钳位的问题。
  #
  # ⚠ 这一跑次是**没有实测背书的新速度**：55 从未在实车上跑过。第一次用它
  #   跑要盯的就是**左右摆和丢线**——那正是上面那条约束描述的症状。
  #
  # 如果车开始左右摆或者丢线，调的是那两个钳位，不是这个数。
  forward_speed: 55
  reverse_speed: -30
  # J3 出去到每个取物区的接近速度。2026-09-15 从 15 提到正常前进速度
  # （操作员：「把 j3 到取物区的速度提高到正常的 别是 15 的安全值了」）。
  #
  # 15 属于"到达靠轮子堵转来推断"那个年代 —— 慢速让那个读数更容易抓。
  # 现在的到达判据是**操作员卷尺实测的距离闸门**（`_reached_gate`），
  # 距离闸门不关心车是怎么到的。撞墙只剩下兜底作用。
  # 车有防碰撞、多快撞都没事（操作员 2026-09-15），所以那个慢值已经没东西可换了。
  pickup_speed: 35
  # 巡线 PID。2026-09-14 现场实测后大幅提高增益。
  #
  # 原值 kp=8 / lateral_limit=8 的转向权限小到不可用，实测量化如下：
  #   偏一路探头 → error = 0.143 → correction = 8 × 0.143 = 1.14 → vy = ±1
  #   vy=1 的实际横向速度 ≈ 0.54 cm/s（实测 vy=20 → 10.8 cm/s）
  #   横向能力上限 lateral_limit=8 → 4.3 cm/s
  #   而前进速度 vx=35 → 15.5 cm/s
  # 也就是"车偏出去的速度比它纠正的速度还快"，车必然越走越偏。现场表现就是
  # 用户说的"跑的时候歪右了"，探头排一侧常亮、读数无法判定。
  #
  # 积分项原来是死的：ki=0.3、integral_limit=2.0，最大只贡献 0.6。而车持续
  # 偏向一侧是**恒定偏置**，只有积分能消掉，所以必须放大。
  kp: 35.0
  ki: 1.0
  kd: 1.2
  integral_limit: 5.0
  # 2026-09-16 随 forward_speed 35 → 45 一起抬，让钳位**咬在同一个
  # line_error 上**。min250e 实测：626 个采样里 2 个顶在 lateral_limit=20、
  # 1 个顶在 yaw_limit=12。两个钳位都按速度同样的 ~30% 放大，车在新速度下
  # 产生的误差对应的转向权限就和以前一样。
  # 2026-09-16 随 forward_speed 45 → 55 再抬一档，比例与上次相同（×1.22）：
  # 26 × 1.22 ≈ 32、15 × 1.22 ≈ 18。这两个数**必须和 forward_speed 一起动** ——
  # 单独提速度不提钳位，就是让车撞进一个答不上来的钳位里（上面那段的原话）。
  lateral_limit: 32
  yaw_limit: 18
  turn_deg: 90
  # 2026-09-16 从 30 提到 40（操作员：「加快左移右移 左旋右旋 倒车的速度」）。
  # D 是开环自终止的，这是路线上**唯一**超调量直接随速度增长的动作 ——
  # 盯紧转向后的姿态，尤其是进搭建区那个 180°。
  turn_speed: 40
  # 转向方向符号 —— **2026-09-15 实测确认**。
  #
  # `_pi_turn_probe.py` 发 `D 0 0 90 30`：车**恰好左旋 90°**，操作员肉眼确认，
  # 编码器偏航投影吻合（四轮同向推进 LF +3341 RF +3364 LR +3329 RR +3316，
  # 而前向/横向投影只有 +2.5 / +15 计数，说明是干净的原位旋转）。
  #
  #   +1   正的 rotate_deg 是左旋     ← 本底盘
  #   -1   正的 rotate_deg 是右旋
  #
  # 所以本路线自己的计划是对的，更早的 auto_route_v1 设计（已删除的 
  # specs/2026-09-09-auto-route-v1-design.md）说「正数右转」是错的。
  # （TURN_TO_PURPLE / TURN_TO_BUILD 那两个既有状态本来就是左转，一直是对的；
  #  它们已在 2026-09-15 随 J3 之后的策略变更一起删除，见 route_v2.md §7.1.6。）
  #
  # 仍然是单一乘数：万一以后换底盘或固件把它翻过来，改这一个值就能同时修正
  # 全部三个转向状态（TAG_2_TURN_RIGHT / JUNCTION_2_TURN_LEFT / JUNCTION_3_TURN_LEFT）。
  turn_sign: 1
  turn_timeout_s: 15.0
  # 偏航编码器计数/度，用于不靠肉眼校核一次转向。同一次实测：3338 计数 / 90°。
  # 反推轴距半对角和 (a+b) ≈ 37.3 cm —— 所以探针最初按 8~18 cm 猜是错的，
  # 这是一台大底盘。仅供参考，状态机不读它。
  yaw_counts_per_deg: 37.1
  # J1 -> J2：不再是一段 3 米盲推，改为「右移到看得见 AprilTag 2 → 右转 →
  # 巡线到 J2 → 左转」。
  #
  # 3 米盲推被两件事否掉：车在 3 米上累积偏航而编码器看不见（麦轮侧向打滑），
  # 而且停止判据依赖掩码序列 10000000 → 00000000 → 00000001 —— 车一歪，全黑段
  # 就读出 00000001 / 00000011，判据提前触发，车停在路中间（2026-09-15 现场）。
  #
  # 现在的横移**短**、由绝对地标终止，后面接的是一段**线的闭环**。这是整个设计
  # 的关键：不再要求任何单个动作精确，因为转向的误差会被后面的巡线吸收掉。
  #
  # 为什么用 V 不用 D：D 是自终止开环，而且**「STOP 能不能打断执行中的 D」至今
  # 未验证**（route_v2.md §4.4）。靠地标终止的横移必须在看到 tag 的那一 tick
  # 就停，所以必须是保持速度指令。V 的横移符号是实测过的：V 0 +20 0 左移、
  # V 0 -20 0 右移，所以状态里把 tag2_strafe_speed 取负。
  # 分块 D 也不行 —— runner 按 (state, forward, right, rotate, speed) 去重，
  # 每块的键完全相同，第二块永远不会发出。
  #
  # 里程窗口是**保险**，不是到位判据。tag 2 要等车移动一段才进相机视场：相机沿
  # 车头方向看（外参 rotation 0），水平视场约 60°，而停在 J1 时 tag 2 根本不在
  # 视场里。**「移动多远才看得见」是现场几何问题，不是距离标定**，所以上下限在
  # 实测之前都是占位值。
  #
  # ⚠ 窗口量的是**横向**里程投影 (LF+RF−LR−RR)/4，**不是**前进投影。
  # 横移时车是侧向走的，前进投影恒等于 0，用前进里程做窗口永远不会打开。
  # 横向常数 56.8 和前进常数 58.8 一样，是拿 `D` 的指令距离反推的（因此吸收了
  # `D` 的过冲）；这里用在 `V` 横移上，**没有验证过**。
  #
  # 注意横移期间里程只有约每 0.3 秒采样一次（ENC/SPD 查询按 0.15 秒交替，且发出
  # V 的 tick 不发查询），vy=20 时约合 3 公分一个采样点 —— 上下限都要留这个余量。
  #
  # 2026-09-15 `_pi_tag2_search.py` 实测（从 J1 起步，speed 20）：
  #     t=6.24s  首次检出      bearing +15.4°   ≈ 49 cm
  #     t=6.91s  连续 3 帧稳定  bearing +11.0°   = 54.7 cm
  # 也就是说 tag 2 要**右移约 49 公分**才进视场。下限放 40（低于首次检出，
  # 免得把第一次合法检出挡掉），上限放 90（错过 tag 时不要再多跑 50 公分）。
  #
  # ⚠ 可见窗口很窄（约 6 公分），操作员确认这个窄窗口不是问题：车停住的位置
  # 可以直接右旋，而且旋转很稳。
  tag2_search_min_cm: 40
  tag2_search_max_cm: 90
  # 正数幅值；横移状态会取负，因为 J1 的分支在右侧。
  #
  # 20 → 40，2026-09-15 操作员：「对于后退和左右横移 速度可以提高点」。
  # 这一段是路线上唯一**不是寻线**的横移：它由相机看到 tag 终止，不由探头排找线
  # 终止，所以下面那条「采样跟不上」的顾虑不适用，这 55 公分本来就是纯耗时。
  # 代价是里程采样变粗：约 0.3 s 的采样间隔在 vy=40 下变成约 4.8 cm（原来 2.4 cm），
  # 而 tag2_search_min_cm / max_cm 就是它必须停进去的窗口。
  #
  # 40 → 50，2026-09-16 操作员：「加快左移右移」。采样代价再付一次：约 0.3 s
  # 的间隔现在是约 6 cm，对着 50 cm 宽的窗口（40…90），还能装下好几个采样点。
  # 也正因为如此，这里是**上限** —— 再快窗口内就不足十个采样点了。
  tag2_strafe_speed: 50
  # 右转 90° 之后**车不在线上**，它还在刚才横移经过的那片全黑区上（掩码 0x00）。
  # 实测 2026-09-15：掩码从 0x00 一路保持了整个 55 公分横移，转向不会改变这一点。
  # 所以转向**不能直接接巡线** —— 必须先左移，直到线重新出现在探头排下面。
  #
  # 视为「回到线上」的掩码，按操作员给的：
  #   0x81  10000001  x1 与 x8 是白、中间六路压黑 —— 正中压线
  #   0x80  10000000  x1 白，x2..x8 压黑
  #   0x01  00000001  x1..x7 压黑，x8 白
  # 0x80 与 0x01 互为镜像：七路压黑、白的那一路在某一端。三个合起来覆盖
  # 「探头排压在黑上、至少有一路离开」。
  #
  # ⚠ 0x80 第一版漏了，代价是一趟实车：2026-09-15 那次寻线一直左移冲过了线，
  # 掩码轨迹是 127 → 63 → 31 → 7 → 3 → 128 → 192 → 240 → 255（黑从 x1 长起来
  # 又原路退出），**而它途经的 128 恰好不在白名单里**，于是又往前跑了 40 公分
  # 才撞上边界停住。
  #
  # 用白名单而不是「只要不是全黑」，因为**全黑正是车可能起步时所处的状态**。
  #
  # ============================================================================
  # ⚠⚠ 2026-09-15 当天试过把这里换成「无关位模式」1x0000x1（x1 与 x8 白、
  #     x3..x6 黑），**当天撤回**。不要不读这段就再试一次。
  #
  #     它在这里**永远不会命中**，而且这个结论不需要任何几何 —— 只看录下来的
  #     掩码就够：车是**横移压上线**的，黑必然从 x1 长起来。把**成功那一跑**
  #     逐帧过一遍：
  #
  #         11111111 ×18 → 00111111 → 00011111 → 00001111 → 00000011 → 退出
  #
  #     x1 在这些帧里**全是 0**，模式一帧都匹配不上。车会一路左移到 35cm 上限
  #     然后停住。原因是模式描述的是「车已经压在线上」那个姿态的读数，而**横扫
  #     中的车永远不是那个姿态** —— 它是从线的侧面压上去的。
  #
  #     配套的几何论证（「50mm 的线在 70mm 的排上最多压黑 N 路」）**也是错的**，
  #     而且错得值得记一笔：排是**架在一定高度上**的，每个探头是一个有面积、
  #     边缘发虚的光斑，不是点。它报出来的黑比底下的胶带**更宽**。
  #     直道上 7 路压黑占 50%（START_TO_JUNCTION_1 实测）就是这个效应，
  #     不是胶带变宽了。**别再拿探头间距去推一维区间模型。**
  # ============================================================================
  seek_line_masks: [0x81, 0x80, 0x01]
  # 2026-09-16 新增（操作员：「丢线后出现黑就判定找到线了」）。
  #
  # 上面三个掩码都要求**8 路里 7 路压黑**，那是路线调好的时候探头排的读数
  # （直道上 7 路压黑是常态）。2026-09-16 同一副探头排读到的是**窄得多的黑**：
  # 车在起点正骑在线上、掩码左右对称 `11000011`，只有 **4 路**压黑；直道全程
  # 4~5 路，而不是 7 路。于是找线扫满 ±38 公分**一次都没能产生白名单掩码**，
  # 判定失败并保持 —— 数据在 `logs/full_20260916_121302.jsonl`。
  #
  # 打开后：某次找线里只要先看到过丢线（0xFF，车下一片黑都没有），之后**再出现
  # 黑**（1~7 路压黑）就算找到了线，交给巡线 PID。
  #
  # **0x00 仍然不接受**，这条排除就是原来的保险：车可能一进这个状态就停在
  # J1 右边那一大片全黑上，接受 0x00 会在第一拍就宣布成功。排除它的代价很小 ——
  # 2026-09-16 那一跑第一帧黑是 0x00，只持续 4 帧（约 0.5 秒）就变成 11000011。
  #
  # 它**不动** seek_line_masks 本身：那三个精确读数仍然无条件接受，所以原来能
  # 提前结束找线的情况一个都没有变。
  seek_line_accept_black_after_loss: true
  # 但「出现黑」不能等于「一路探头闪了一下」—— 录数据把这条钉死了。
  #
  # 把 2026-09-16 那一跑逐帧回放（按字面规则「丢线后任何黑都算」）：**t+1.68 s
  # 就结束了**，掩码 0x9F —— **2 路压黑，3 帧后就没了**。那一趟扫描里这种划痕
  # 出现过好几处（t+1.68~1.94 的 0x9F/0xC7/0xF9，t+4.10~4.99 的
  # 0xFE/0xF9/0xF3/0xE7/0xCF/0x9F/0x3F），它们是**车在横穿过一些细黑东西**，
  # 不是线走到探头排下面：压黑路数**从没到过 4**，而且帧与帧之间到处乱跳。
  #
  # 车最后真正停住的那块黑是另一个东西（t+19.6 s 起）：0x07/0x0F/0x83/0xC1/0xC3，
  # **4~5 路压黑、连续一百多帧**。**4 在这份录数据上把两类切得干干净净** ——
  # 每一次「横穿」峰值都是 3，每一个真实读数起点都是 4。
  #
  # 4 也正好是「探头排压在线上」在这个工况下的诚实读数：正是这次逼出改动的那些
  # 数据里，车居中的读数就是 0xC3（4 路）。门槛再高一点就会把反例本身拒掉。
  seek_line_min_black_probes: 4
  # 还得**稳住**。上面那些横穿只持续 1~3 帧，真正的黑连续一百多帧，所以这一条
  # 是防单帧毛刺的廉价保险，不是主判据。2 帧按 poll_period_s 是 0.12 秒。
  seek_line_confirm_frames: 2
  # 两个寻线状态各自的方向，写成**带符号的横向速度**。
  # **正值 = 左移** —— 2026-09-15 实测（`V 0 +20 0` 左移），所以这个符号不是猜的，
  # 不像 `D` 的第二字段那样名义叫 right、实际往左。
  #
  # **三次寻线方向不一样**，这正是它必须逐次配置而不是共用一个幅值的原因：
  #   tag 2 右转之后，线在车的**左手边**
  #   J2 左转之后，线在车的**右手边**
  #   J3 左转之后，线在车的**右手边**   ← 和 J2 同侧，但这是巧合不是规律
  # 前两次是镜像的。后两次虽然都左转、线也都在右边，但 J2 和 J3 是两个不同的
  # 路口，几何各自独立，所以照样分开写。三次都由操作员现场确认（J3 是
  # 2026-09-15）。
  #
  # 2026-09-15：四个寻线 vy 全部从 ±20 提到 **±30**（操作员：「对于后退和左右
  #   横移 速度可以提高点」），当时明确记为**折中值、不要提到 ±40** —— ±40 正是
  #   2 倍速那两次实验用的档，那两次寻线是**失败**的，实测：
  #     fast  J3 寻线     13.57 s  max|lat| 42.0  end_mask 0x07  intent=stop → 失败
  #     fast  取物区寻线   22.28 s  max|lat| 44.2  end_mask 0xC0  intent=stop → 失败
  #     fast2 J2 寻线     11.81 s  停在 34.28（上限 35）正在走向同一个失败
  #   而 ±20 的四次完整跑（fullrun / fullrun2 / fullrun3 / stable2）是 **16 次寻线
  #   16 次成功**，横向停在 6.5~27.9 cm。
  #
  #   机制没有完全钉死，但形状清楚：寻线时掩码大约每 0.15 s 才刷新一次
  #   （run_route_v2.py 的 `_last_motion_query_at >= 0.15` 那道闸门），±40 时每拍
  #   跨约 2.4 cm，探头排可能在两拍之间**整个跨过线**而没有一拍读到它。±30 是每拍
  #   约 1.8 cm。真正针对这个机制的是下面那个**慢速兜底扫**。
  #
  # 2026-09-16：提到 **±40**（操作员：「提到 ±40」），上面那条"不要提到 ±40"
  #   由此作废 —— 但作废的理由是**兜底扫已经存在**，不是 ±40 变安全了。
  #   当时的判定是"丢了就丢了"（J3 死在 42.0、取物区死在 44.2，都没有第二次机会）；
  #   现在第一遍扫丢空会以 seek_line_fallback_speed 反向重扫一遍，见 `_seek_line`。
  #   也就是说：**快扫的高丢失率是靠第二扫兜住的**，两者是一套，不能只留一个。
  #   旁证：min250e 在 ±30 下 J2 和 J3 都是第一遍就咬住（30.87 / 37.12 cm），
  #   确实还有余量。
  junction_2_seek_line_vy: 40      # tag 2 右转之后：线在左边 → 左移
  junction_3_seek_line_vy: -40     # J2 左转之后：  线在右边 → 右移
  # J3 左转之后寻线的方向 —— **2026-09-15 实车改正：往左（+20）**。
  #
  # 原值 -20（向右）来自操作员早先的口述，已作废。实测把它否掉了：
  #   J3 左旋完成时掩码 127 = 01111111（x1 白、x2..x8 黑），黑在车的【左边】；
  #   一往右移就变成 255 全白 —— 车是在【离开】线，不是靠近它。
  #   run3 / run4 两趟都往右跑满上限（35cm，实测 37cm / 205 tick）没找到线，
  #   停住保持，随后静止把蓝牙链路等断 → FAULT_SAFE。
  # 2026-09-15 操作员更正："最后一次左旋了应该左移找线"。
  # 2026-09-16：30 → 40，理由与上面 junction_2/3 那两条同（兜底扫已存在）。
  pickup_seek_line_vy: 40
  # 共用边界。**现在是「单次扫」的边界，不再是「整个寻线放弃」的边界。**
  #
  # 35，不是 60。2026-09-15 实测：成功和失败**两跑**里黑都是 lat 14.7~15.6 cm
  # 出现的、20.2 cm 就已经压到线上。数据里没有任何一次线在更外面，所以 60 有
  # 40 cm 是纯盲走 —— 而失败那跑正是把这 40 cm 全部用来往 J4 更深处开的。
  # 按实测 0.92 cm/tick，35 cm 约 15 s，在下面那个超时之内。
  #
  # 它仍然必须收紧：这是拦住第一段扫往外面乱开的那个数。但它不再是**放弃点** ——
  # 扫满 35 cm 就掉头，反方向再扫 35 cm（共 70 cm，按兜底速度约 4.4 s）。
  #
  # ⚠ 余量其实很薄：stable2 的 J3 寻线是在 **41.8 cm** 才找到线的（判据先查掩码
  #   再查上限，所以「找到」的那一拍不会因为超限而失败）。也就是说第一段扫有相当
  #   概率扫满 35 cm 什么都看不见 —— 兜底扫不是理论保险，是会真用上的。
  seek_line_max_cm: 35
  # 兜底扫的速度，**幅值**；方向永远是第一段扫的反方向，相位由 _seek_line 管。
  #
  # 慢是**机制**，不是保守：实测的失败模式是快扫**整个跨过线**而探头排一拍都没
  # 读到，那么同样的速度扫回来只会用同样的方式再跨过去一次。±20 下同一段地面
  # 的采样密度是 ±40 的两倍。
  seek_line_fallback_speed: 20
  # 20.0 → 45.0，因为现在它要覆盖**两段扫**。
  #
  # 不放大它的后果很具体：20 秒会在慢的那次里**先把兜底扫掐断**，让整个兜底失效 ——
  # 而兜底正是这次要加的东西。算账用的是两个实测速率：
  #   典型：成功的寻线是 ~7 cm/s（fullrun 25.4 cm / 3.64 s、fullrun3 27.9 cm /
  #         3.79 s），35 + 70 = 105 cm 约 13 s。
  #   最慢：stable2 的 J3 寻线 41.1 cm 爬了 13.13 s，即 3.1 cm/s，同样形状走完
  #         105 cm 要 ~33 s。
  # 45 秒给最慢那次留了约 35% 余量。
  #
  # 放大它是安全的：**真正拦住车的是距离边界，不是这个超时** —— 不管跑多久，
  # 两段加起来也不可能超过 2 × seek_line_max_cm。这个超时只抓「完全没在动」。
  seek_line_timeout_s: 45.0
  # 东段是巡线到 J2，而 J2 是 L 角：线拐弯，探头排会丢线。所以这一段和 J1 用
  # **完全相同**的判据（持续 11111111 + 里程范围），**不是** junction_mask。
  # 用 0x80 判会重现这次要消灭的那个失败模式。
  #
  # ⚠ 均未实测。
  junction_2_line_loss_gate_cm: 20
  # 兜底，**不是**到达判据。
  #
  # 2026-09-15 实车：这一段被这个上限**在 192cm 处截停**，而全程掩码里
  # **一个 11111111 都没有** —— 线一次没丢，说明车还在直道上、**根本没走到拐角**。
  # 所以这个值必须放得足够远，远到真正的拐角先到。它取代的那段是 3m 开环横移，
  # 东段不可能比那更长：400 是失控保护网，仅此而已。
  junction_2_max_travel_cm: 400
  # J2 丢线后、左旋前，**倒车回到线上**。
  #
  # 车是冲过拐角才停的（丢线去抖 + 刹车距离），从那儿原地左旋等于绕拐角外侧
  # 一点转，整条下一段都会偏。所以先倒回线上，再从线上左旋 —— 也就是 J1 冲过路口
  # 之后那套动作，所以逻辑是抽出来复用（`_creep_back_onto`）而不是照抄。
  #
  # 这两个界**故意和 J1 的分开**：J1 冲过的是一个还看得见的路口读数，这里冲过的
  # 是线的尽头，两个过冲量不是一回事。⚠ **均未实测** —— 写这两个数的时候，
  # 第一次跑到这个状态的实车还没发生。
  junction_2_back_max_reverse_cm: 30.0
  junction_2_back_timeout_s: 8.0
  # 倒车时"什么算回到线上"—— **2026-09-17 操作员现场指令改的判据**。
  #
  # 原来的判据是 `seek_line_masks`（`[0x81, 0x80, 0x01]`，三个"探头排压在
  # 线上且居中"的精确位型）。那个判据对**转向后的寻线**是对的——它从线旁边
  # 横移过来，可以要求一个居中读数。**但倒车这里用它是错的**：这个状态是
  # 「持续丢线」进来的，然后倒车，探头排是从线的**末端**压上来、而且横向偏
  # 多少完全未知，所以它压到的是线的**任意一段**。
  #
  # 【实测】2026-09-17 当场四跑：三跑整段倒车报的恒是 `0x00`，一跑报 `0xC0`，
  # 三个白名单一个都没命中 —— 于是倒车**永远认不出线**，一直倒到
  # `junction_2_back_max_reverse_cm` 上限、然后保持停车到跑次结束。
  # **而操作员全程看着探头排已经压到线上了。**
  #
  # 操作员定的规则：**线既然已经真的丢了（这是进入本状态的前提），那么只要有
  # 任意一路探头压黑，就算线回来了。** 所以现在接受**除 `0xFF` 以外的一切掩码**。
  # ⚠ `0xFF` 是结构性排除、不是口味问题：它就是"让车进到这个状态"的那个读数，
  # 接受它等于第一拍就宣布到达。
  #
  # 设 `false` 即恢复那三个精确位型。**J1 的倒车不受影响**——它认的是路口读数，
  # 那确实是一个精确读数。
  junction_2_back_accept_any_black: true
  # J2 → J3：**用里程计，不用传感器**。
  #
  # J3 是 T 字路口 —— 线直着往前走，左边分出一条岔路。路线别处用的两个到达
  # 判据在这里**一个都不成立**：
  #
  #   持续 11111111   不可能。线根本不断。2026-09-15 实测：冲过 J3 之后又沿
  #                   "前方那条线"跑了 573 公分，全程一次丢线都没有。
  #   junction_mask   这正是 J1 当初被摘掉的那个判据 —— 车歪一路就误报。
  #                   同一天同一趟：J3 腿在 124.9 公分处被它截停，line_error
  #                   只有 0.14，车在直道正中间，纯粹是巡线自己的抖动连出了
  #                   3 帧 10000000。
  #
  # 而且**路口本身没有特征**。探针那趟在 travel 81 公分处穿过 J3，读数
  # 11000000 / 00000001 / 00000011 / 00000111 —— 和它前后一路的普通抖动
  # 一模一样，分不出来。反过来要求 00000000（8 路全黑）更糟而不是更好：
  # 10000000 和 00000001 已经是**7 路全黑**，全黑判据整个压在**一路**的
  # 余量上。
  #
  # 所以这一段交给里程计 —— 也正是路线别处一直在营造的那种理想情况：
  # **一条直线、零转向**，而且起点是传感器确认过的姿态（它前面那个寻线状态
  # 停在 10000001 上）。2026-09-15 卷尺实测约 2.1 米（操作员："大概2.1m"），
  # 同一天车在这一段 422 公分里横向只漂了约 2 公分，所以它会可靠地走到。
  # J3 只用来给后面那一段定起点：左旋 90° → 右移寻线 → 巡线到取物区撞墙。
  # 那一段全程不依赖里程 —— 落点由 PICKUP_SEEK_LINE 在线传感器上找回来，
  # 所以这里几公分的误差会被吸收，不累积。
  #
  # 注意里程计**低估约 3.5%**（58.8 计数/cm 是拿会过冲的 D 指令距离反推的）。
  # 这个方向仍然是安全的：触发点偏早 → 左旋点偏早，而后面是寻线闭环，能把线找回来。
  junction_3_distance_cm: 210.0
  # 停车后"倒回路口"的爬行参数。
  #
  # 实测 2026-09-14：J1 靠 3 帧去抖确认，加上刹车距离，车**一定会冲过路口**
  # 停在空轨上（读数 11111111）。用户现场确认：「干脆利落地停止了 但是不是停在
  # 10000000 上」。所以停车后以低速倒车，直到掩码重新出现路口特征 `10000000`。
  #
  # 这是闭环在传感器上的，不依赖任何距离标定，也不会随电池电压或地面摩擦漂移。
  # align_speed 必须为负（倒车）；正数会把车推得离路口更远。
  # 2026-09-15 现场：从 6 提到 12。J3 之后的回程在 -6 下**车没有动**（操作员怀疑
  # 是速度太低、克服不了静摩擦）。这个值同时被倒车和回程前进两段使用。
  # -12 → -24，2026-09-15 操作员：「对于后退和左右横移 速度可以提高点」。
  #
  # 这是路线上**唯一**真正使用的倒车速度：J1/J2 回线的 creep、以及两次从取物区
  # 倒车回 J3，走的都是它。（config.py 里的 `reverse_speed` 只被校验，没有任何
  # 地方拿它发命令 —— 不要再以为改那个有用。）
  #
  # 实测对照（-12）：从取物区1 倒车回 J3 是 21.2 s / 103.8 cm，J3 之后的接近
  # creep 是 4~5 s。提到 -24 这些时间大致减半。
  #
  # ⚠ 要盯的是**倒车腿的到达判据**，它们是黑/白边界上的单帧读数：倒得越快，
  #   每帧跨过的公分越多，一个「探头排滑离线」的误判就会晚得多才触发 —— 反过
  #   来说，它也会在更远的公分数上才被确认。取物区1 那条回程就是这个风险的
  #   实测案例（stable2：只倒了 2.77 cm 就判到达），**现已改成纯距离、不看传感器**。
  # 2026-09-16：-24 → -32（操作员：「加快…倒车的速度」）。
  # 这正是上面那条警告咬得最狠的地方：取物区1 的回程和 J1/J2 两次 creep 都是
  # **倒车时读传感器**判到达的，而每 50 ms 一帧现在跨约 0.65 cm（原来约 0.49 cm，
  # 按实测 0.41 cm/s 每单位）。这是到达边界粗了 30%，不是换了个判据。
  # 哪条倒车腿开始冲过头，就把这个数调回去。
  align_speed: -32
  # 2026-09-15 从 2 降到 1。实测倒车经过路口时 `10000000` **只出现了 1 帧**
  # （t=6.53 是 192，t=6.61 是 128，t=6.68 就已经进了全黑区 0），要求连续 2 帧
  # 就永远确认不了，车会一直倒退到超时。用 1 帧是权衡后的选择：宁可早一帧停在
  # 10000000 的边缘，也不要完全对齐不上。
  align_confirm_frames: 1
  # 倒车时**还有一个读数也算"回到 J1"**：00000000。
  #
  # 2026-09-15 现场实测（用户提出，数据证实）：某一跑倒车轨迹是
  #     7.65s  255 11111111  travel  0.9
  #     7.73s  208 11010000  travel  0.9
  #     7.80s    0 00000000  travel  0.9
  #     ...  全黑维持 5 公分 ...
  #     9.98s    1 00000001  travel -4.1
  #     ...  一路倒退到 -12.24 才停
  # **全程没出现过 10000000。** 只认 0x80 的判据在这一跑必然失败 ——
  # 不是判据太严，是那个信号根本没来。用户原话："倒车的时候 10000000 和
  # 00000000 都可以判定为到 j1"。
  #
  # 不会误伤：成功那几跑倒车经过的是 254→240→192→128，全程没有 0x00，
  # 加了这条照样停在 128。
  align_alt_mask: 0
  # 但 0x00 是本赛道**最常见**的读数 —— 横移实测 J1 右边有连续 200 公分全黑。
  # 所以它单独用太容易撞上：哪次车冲过 J1 冲得特别远，倒车最先碰到的黑区
  # 未必在 J1 上。倒车超过这个距离就放弃并保持停车，而不是继续退。
  align_max_reverse_cm: 8.0
  # J1 对齐的**第二阶段**，2026-09-16 新增（操作员：「后退找不到全黑就往前找」）。
  #
  # 倒车阶段建立在一个假设上：车停下来时**已经冲过**标记，所以标记在车后面。
  # J1 的这个假设可能是错的 —— 它的到达判据是「持续丢线 + 里程过 50」，一次
  # 误判的丢线会让车停在**还没到**路口的地方，此时一路倒车是**离标记越来越远**，
  # 而旧行为是锁存 `_align_failed` 然后保持不动。
  #
  # 打开后：倒车阶段跑完它的界仍然没找到标记，就掉头**往前找**，用它自己的
  # 距离和超时界，两个方向都找不到才保持停车。两个阶段找的是同一组读数，
  # 「什么算到位」没有变。
  #
  # **J2 的倒车（`JUNCTION_2_BACK_TO_LINE`）显式传 0、不启用这个阶段** ——
  # 那里车是真的从 L 角的线尽头开出去了，标记明确在身后，往前找等于开回刚
  # 冲过去的那个角。
  #
  # 20 公分而不是更大：要盖的失效是「停早了」，那是个小误差。倒车界只有 8 公分，
  # 所以前移界留 20 公分已经有两倍余量；两个界都是「找不到就必须停下来」。
  align_forward_cm: 20.0
  align_forward_speed: 20
  align_forward_timeout_s: 8.0
  # 找不到就放弃并保持停车 —— 一直倒车是能想到的最坏反应。
  align_timeout_s: 8.0
  pickup_wait_s: 3.0
  # 撞墙判定：这一段还在跑，里程计却不动了。
  #
  # 原先还要求 SPD 的 OUT 也塌下去，**那一半就是它从来没响过的原因**：OUT
  # 不是测量值，是固件正在下发的占空比。run6（2026-09-15）里车在第一段撞停
  # 后编码器整整 62 秒钉在一个数上，而 OUT 一直报 47 —— `47 <= 15 * 0.15`
  # 永远不成立，所以判定全程沉默，直到固件碰巧把 OUT 报成 0 才姗姗来迟地
  # 宣布到达。轮子是**真的堵转**，没有打滑，所以里程计就是全部判据。
  contact_stationary_s: 0.5
  # 到达判据的主判据换成了**里程** —— 操作员 2026-09-15 用卷尺量的。
  #
  # ⚠ **操作员的编号和状态名是反的，别配错**（2026-09-15 原话："目前这个位置
  # 是 j2 到 j3 然后左旋到取物区2"）：
  #   J3 --左旋--> **取物区2** = **90 公分**   （第一趟，PICKUP_ARRIVED）
  #   J3 --倒车回J3、右旋--> **取物区1** = **1.1 米**（第二趟，PICKUP_2_ARRIVED）
  #
  # 所以两个键按**状态**命名，不按操作员的区号命名 —— 名字配错腿的代价是车
  # 停在错的地方，这个代价不值得为命名好看去冒。
  #
  # 墙是个已知的地方，所以"到了没有"就是跟一个数字比，而不是从电机反推。
  # 撞墙判定留着做后备 —— 万一带子量错了，它兜底。三次实测里撞墙触发那一刻
  # 的行程是 101 / 120 / 147 公分，这就是单靠堵转判定要吸收的离散度。
  pickup_arrived_distance_cm: 90.0       # J3 -> 取物区2（第一趟）
  pickup_2_arrived_distance_cm: 110.0    # J3 -> 取物区1（第二趟）
  # 第三趟，搭建区。**这是失控保护网，不是到达判据** —— 这条腿的到达判据就是撞墙，
  # 和以前一样，没有别的。
  #
  # 2026-09-15 当晚加过一个距离闸门、当晚就撤了。操作员量的是「j2到搭建区大概是
  # 60cm」，全程跑果然停在 62.41 公分 —— 而**这条腿实际约 2.6 米**，闸门把车停在
  # 离搭建区还差两米的地方。**是量错了，不是判据错了**：这条腿很长，它唯一的
  # 无歧义的终点就是那面墙。
  #
  # 上限存在的理由，是"摆错位置 + 完全没有界"的代价。`wall2_20260915.jsonl`：
  # 车被放在线外（mask 33 秒钉在 11000000、横漂 177 公分），巡线没东西可跟，
  # **一路开了 468 公分**才等到一个轮子被别住 —— 之所以要那么久，是因为轮子是在
  # 墙上**打滑**（enc_d 连续约 27 秒读 40~200），撞墙判定根本看不见。
  #
  # 400 是**故意远在 2.6 米之外**，正常摆位下永远不会触发；和
  # `junction_2_max_travel_cm` 同一个量级、同一种定位。触发时**保持停车**，
  # 不会谎报一个没有证据的到达。
  #
  # ⚠ 400 → 500，2026-09-15。
  #
  # 🔴 **当初给这个改动写的理由是错的，记在这里免得有人重新推一遍**：理由是
  #    「倒车缩到 30 公分会让这条腿长 ~74 公分、顶穿旧的 400」。**不会。**
  #    `backoff_20260915.jsonl` 实测这条腿是 **179.83 公分** —— 短了 147 公分，
  #    不是长了，保护网根本没接近触发。
  #
  # 保留 500 的**诚实理由**是下面那个最小里程门限：拒绝提前撞停意味着车可能开
  # 得比以前更远，所以保护网必须离真墙（stable2 实测 326.78）足够远。500 够，
  # 400 其实也够 —— 但在重新量出这条腿真实长度之前，没有理由把它收回去。
  #
  # ⚠ 500 → **360**，2026-09-16（操作员：「将右旋180度到搭建区的碰撞窗口收窄点」）。
  #   上面那段"保留 500"的理由**由此作废**，作废的理由是判据已经变了：写那段话时
  #   到达判据是拦住擦碰的唯一一道，现在下面那个最小里程门限会直接拒掉擦碰，
  #   所以保护网只剩一个职责 —— 圈住"车根本不在这条线上"时它能跑多远。
  #
  #   360 离实测真墙 326.78 留 33 公分：正常摆位够不着，而给跑飞的余量比 500 少
  #   140 公分。min250e_20260915 就是这笔账的实证 —— 它脱线后跑了 504.67 公分、
  #   轮子全程没卡死，在这个值下会**早 145 公分**被拦住。
  #
  # 触发时**保持停车**，不谎报到达。
  # ⚠ **已知且已接受**（操作员 2026-09-15）：保持停车会让里程计安静下来，撞墙判定
  #   把这当成撞墙，而到达判据排在它**前面** —— 所以越界仍可能在下一拍被宣布成
  #   FINISHED。把窗口收窄就是缓解手段，**不要再把它当成 bug 去"修"**。
  pickup_3_max_travel_cm: 360.0
  # 撞墙必须走满这个里程才算到达 —— **不是** §7.1.13 那个已撤回的距离闸门。
  # 那个闸门是「走满 60 公分就**宣布**到达」，把车停在离搭建区两米的地方；这个
  # 是「没走满就**拒绝**这次撞停」，方向相反。两个的存在都是因为这条腿唯一的
  # 到达信号是「里程计停住了」，而它分不清搭建区的墙和路上别的什么东西。
  #
  # 数据依据（2026-09-15，两端都有实测）：
  #   **179.83 公分** —— `backoff` 里车撞停在半路（操作员确认「停在半路了」），
  #                     而 `lat` 全程 0~2.29 压在线上、**没丢线**。这是门限必须
  #                     **拒绝**的那种撞停。
  #   **326.78 公分** —— `stable2` 撞到**真墙**、到搭建区。操作员卷尺独立佐证：
  #                     「取物区1到搭建区大概长3.2m」，而 326.78 公分就是 3.2 米。
  #
  # **250 取的是这两个数的中点**（约 253），取中点本身就是理由：下面留约 70 公分
  # 的拒绝余量，上面留约 70 公分的接受余量。取靠近上端的值是**错的取舍** ——
  # 定 300 的话，一跑在 295 公分撞上真墙就会被**拒绝**，车会继续往墙里顶。
  #
  # ⚠ 250 → **300**，2026-09-16，上限同一次降到 360。窗口现在是 **[300, 360]**：
  #   离实测真墙下面 27 公分、上面 33 公分。
  #
  #   300 而不是 250 中点，是这次"收窄"**刻意要付的那一半代价**，代价说清楚：
  #   真墙如果在 295 公分被撞上，会被**拒绝**，车会往墙里顶。之所以认这笔账，
  #   是因为 min250e —— 脱线的车能磨很远，最小里程每降一公分，就是多给脱线的车
  #   一公分跑道去凑够"到达"。
  #
  # ⚠ 如果 179.83 处那个东西是**真障碍物**而不是擦碰，车现在会去顶它。§7.1.13
  #   量过那个代价：轮子会**打滑**（encoder_delta 每拍 40~200）而不是被别住，
  #   于是撞墙判定失明、里程计却在涨 —— 车可能一路磨到 250 公分，然后在一个
  #   不是搭建区的墙上**宣布到达**。第一次用这个门限的跑次要盯着。
  pickup_3_min_travel_cm: 300.0
  # ==========================================================================
  # 丢线也继续直行的状态，**只给最后那条长直行**（2026-09-16 操作员：
  # 「最后的长直行 单独增加逻辑 即使丢线了 也继续直行」）。
  #
  # 实测（run3 / run4，`logs/full_20260916_1233*.jsonl`）：这条腿**42% 的帧
  # 是丢线**（run3 124/296、run4 138/327），而巡线 PID 一丢线就发 STOP ——
  # run3 在 `11111111` 上发了 18 次 STOP、run4 发了 20 次。于是 3.2 米的直道
  # 被切成**走走停停**，耗时 37~41 秒、姿态发飘。
  #
  # 操作员对成因的判断：「因为场地问题 巡线检测最后的直行不是很稳 **明明在线上
  # 但是检测一卡一卡地**」—— 车在线上的时候检测在抖，不是车真的离线。
  #
  # 打开后：这些状态在**丢线的那一拍**发 `V <速度> 0 0`（直行）而不是 STOP；
  # **有线的时候照常走 PID 巡线**。所以它是「丢线时保持航向」，不是「这一段
  # 完全不巡线」。
  #
  # 为什么只给这一条：另外两条撞墙腿（`JUNCTION_3_TO_PICKUP` 90 cm、
  # `JUNCTION_PICKUP_2_TO_AREA` 110 cm）短得多、实测没有这个问题；而
  # `JUNCTION_2_TO_JUNCTION_3` 是 210 cm 的巡线腿，它靠巡线把上一段的误差
  # 吸收掉，放开丢线会让那个设计失效。
  hold_course_on_line_loss: [JUNCTION_PICKUP_3_TO_AREA]
  # ==========================================================================
  # J3 之后的三个往返（操作员 2026-09-15）
  #
  # 三条腿都从 J3 出发、都以撞墙结束，前两条回 J3 再转，第三条就是全程的终点。
  # 机械臂将来挂在那两个 *_ARRIVED 上。
  #
  #   第1条  左旋 90°  往右寻线  → 取物区2  停 3s → 倒车回 J3
  #   第2条  右旋 90°  往左寻线  → 取物区1  停 3s → 倒车回 J3
  #   第3条  右旋 180° **不寻线** → 搭建区  撞墙结束
  #
  # ⚠ 转角是相对**车当前朝向**算的 —— 倒车不改变朝向，所以回到 J3 时车头还朝着
  # 出程的方向。第 3 条不需要寻线，是因为 180° 正好把车转回线上（操作员）。
  # ==========================================================================
  # 2026-09-16：30 → 40，理由与 junction_2/3 那两条同（兜底扫已存在）。
  pickup_2_seek_line_vy: 40          # 第2条：右旋之后，线在车左边
  # 从取物区2 倒车回 J3：**复用 J1 那套逻辑、方向反过来** —— 先倒车直到丢线，
  # 再前进直到出现全黑地标（操作员原话）。
  #
  # 两个方向都设界，理由和 J1 那套一样：过了 J1 之后没有线给"猜错了"兜底，所以
  # 找不到地标的搜索必须放弃并保持停车，不能一直往前开。
  #
  # 2026-09-15 把 60 放到 150（操作员：「距离太小了 我需要就是一直倒车直到丢线」）。
  # 实测 `j3on_20260915.jsonl`：车**倒满了 60 公分，探头排一次都没读到全白**，
  # 在 61.31 cm 撞上这个上限停住并保持了 78 秒。它一路读到的 mask 是
  # 00000011 / 10000001 / 10000000 / 11000000 —— **倒车是沿着同一条线往回走的，
  # 线不会因为倒车而消失**。所以这个界只能是**失控保护网，不是目标**：
  # 操作员卷尺量 J3→取物区2 = 90 cm，150 就是它再加上下一段腿的余量。
  # 若放到 150 仍然丢不了线，那是**判据错了，不是界小了**。
  #
  # 超时 15 秒是同一个动作上的第二道、而且更紧的限制：按 align_speed -12 实测的
  # 4.9 cm/s，15 秒只够倒 ~73 cm —— **只放开距离是没用的**。它从状态开始计时、
  # 覆盖两个相位，所以要同时装得下倒车（150 cm ≈ 31 s）和后面那段前进搜索。
  pickup_1_return_reverse_cm: 150.0
  pickup_1_return_forward_cm: 60.0
  pickup_return_timeout_s: 60.0
  # 从取物区1 出来 —— **2026-09-15 改成纯直线倒车，不看任何传感器**。
  #
  # 操作员原话：「现在取物区1碰撞后不需要识别j3了 直接直线倒车30cm 然后右旋180度」。
  #
  # 它替掉的是一套找 J3 的掩码判据（`pickup_2_return_masks` /
  # `_confirm_frames` / `_armed_mask`，**已删除**）。那套判据在**同一条腿上两个
  # 方向都坏**，实测：
  #   stable2：从 0x81 起步 → 正常武装 → **只倒了 2.77 cm 就判到达**。原因是
  #            `0x01` 同时出现在 `pickup_2_return_masks`（"到 J3 了"）和
  #            `seek_line_masks`（"这是线"）里 —— 而车倒车离线时读到的正是 `0x01`。
  #   seek3：从 0xC0 起步 → **永远见不到 0x81 → 一辈子武装不起来** → 判据一次都
  #          没机会触发 → 一路倒到 150 cm 上限然后永久保持停车。
  # 也就是说判据是"早到 20 秒"还是"永远不到"，取决于车起步时压在哪段掩码上。
  # 固定距离两个失效模式都没有，而且操作员的几何本来就不需要那个地标 ——
  # 车只要在右旋之前离开取物区就行。
  #
  # 30 是**目标**，不是失控保护网（和上面那个 150 不同，那个是故意远在 90 公分
  # 间隙之外）。倒车距离判据的停止精度实测很好：150 那道界触发于 -152.53、
  # 车停在 -156.19（`seek3_20260915.jsonl`），只滑 3.7 公分 —— 所以实际会走
  # 约 33 公分，不是 70。
  pickup_2_return_reverse_cm: 30.0
  # Loop strategy placeholders; measured loop distance remains configurable.
  arm_placeholder_stop_s: 3.0
  j2_line_recovery_segment_cm: 5.0
  # 搭建区到 J2 岔路口实测约 60 cm；倒车 65 cm 后左旋 180°，确保车体完全离开岔路口。
  loop_reverse_cm: 65.0

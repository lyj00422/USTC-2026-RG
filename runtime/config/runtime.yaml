chassis:
  # udev alias for the Pi's UART2 (GPIO0/GPIO1, physical pins 27/28) wired to the
  # STM32's USART3 on PB10/PB11.  The name is kept from the Bluetooth era on
  # purpose: the runtime, the control hub and ~20 scripts under pi-tools/ address
  # the chassis by it, so the wire swap touched only the udev rule.
  #
  # 2026-10-01: the JDY-31 Bluetooth module was replaced by this wire.  The link
  # no longer has an idle session to keep alive, so there is no keepalive block
  # here any more -- see rg_runtime/chassis_link.py for what that used to be for.
  device: /dev/robogame-chassis
  baudrate: 9600
  heartbeat_ms: 50
line_sensor:
  enabled: true
  # Measured wiring 2026-09-14: module TX -> physical pin 18/GPIO24, module RX -> pin 16/GPIO23.
  # Verified on hardware: listening on GPIO23 yields only idle 0xFF, GPIO24 yields the $D frames.
  transport: pigpio_soft_uart
  device: /dev/ttyAMA0  # Ignored by pigpio_soft_uart; retained for optional hardware_uart mode.
  rx_gpio: 24
  tx_gpio: 23
  baudrate: 115200
  # Module protocol: send $0,0,1# and receive $D,x1:0,...,x8:1#.
  frame_mode: ascii_digital
  active_level: 0
  reverse_order: false
  request_command: "$0,0,1#"
  # The module manual requires at least 20 seconds after power-on for probes to stabilize.
  startup_delay_s: 20
  # Retry the stream request until the first valid digital frame arrives.
  request_retry_s: 1
arm:
  device: /dev/robogame-arm
  baudrate: 115200
  probe_timeout_ms: 2000
  action_timeout_ms: 45000
  # 大臂串口的收发记录（一趟一条 JSONL，TX/RX 各记一行）。
  # 2026-09-30 打开：为了查「大臂偶尔不动」。之前这个键不存在，
  # 所以路线从没留下过大臂的任何记录，这个症状根本无从查起。
  log_path: logs/arm_route.jsonl
camera:
  config: config/camera_config.yaml
  output_dir: data/control_hub
safety:
  chassis_settle_ms: 500
  require_real_sensors_for_auto: true
control_hub:
  host: 0.0.0.0
  port: 8080
  control_lease_ms: 900000
  log_path: logs/control_hub.jsonl
